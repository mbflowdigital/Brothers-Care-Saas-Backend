name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BrothersCare.slnx

      - name: Build
        run: dotnet build BrothersCare.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test BrothersCare.slnx --configuration Release --no-build

      - name: Verify formatting
        run: dotnet format BrothersCare.slnx --verify-no-changes --no-restore

      - name: Publish API
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          dotnet publish src/BrothersCare.Api/BrothersCare.Api.csproj
          --configuration Release
          --no-restore
          --output artifacts/api

      - name: Upload API artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: brothers-care-api
          path: artifacts/api/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy API
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: brothers-care-api
          path: publish

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./publish/
          server-dir: /
